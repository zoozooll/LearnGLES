name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: websites/package-lock.json

      - name: Install dependencies
        working-directory: websites
        run: npm ci

      - name: Build Docusaurus
        working-directory: websites
        run: npm run build

      - name: Create .nojekyll
        run: touch websites/build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: websites/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
